version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: iams_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iams_user
      POSTGRES_PASSWORD: iams_pass
      POSTGRES_DB: iams_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: iams_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iams.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  postgres_data:
